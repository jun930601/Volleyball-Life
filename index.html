<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>排球人生 v4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef6ff;background:#06101b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#071523,#040a11);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.hero{text-align:center;padding:45px 8px}.hero h1{font-size:42px;margin:8px}.sub,.muted{color:#91a4b8}.card{background:linear-gradient(135deg,#0c1c2c,#091522);border:1px solid #29455c;border-radius:16px;padding:16px;margin:12px 0}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin:5px 0;font-weight:800;font-size:16px;background:#26d890;color:#052116}.secondary{background:#10263a;color:#dcecff;border:1px solid #31536e}.gold{background:#ffbd38;color:#241800}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.identity{display:flex;align-items:center;gap:12px}.jersey{width:64px;height:64px;border:2px solid #ffbd38;border-radius:10px;display:grid;place-items:center;font-size:30px;font-weight:900}.pill{padding:7px 11px;border-radius:9px;background:#17334a}.grade{background:#ffbd38;color:#211500;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{text-align:center;background:#0c2032;border:1px solid #294a64;border-radius:10px;padding:10px 5px}.metric b{display:block;font-size:23px}.timeline{border-left:3px solid #2c91e8;padding-left:13px;margin:14px 0}.event{position:relative}.event:before{content:'';position:absolute;left:-22px;top:25px;width:12px;height:12px;border-radius:50%;background:#2c91e8}.event.green{border-color:#24dc98}.event.green:before{background:#24dc98}.event.goldline{border-color:#ffbd38}.event.goldline:before{background:#ffbd38}.event.purple{border-color:#a47aff}.event.purple:before{background:#a47aff}.title{font-weight:900;font-size:19px}.greenText{color:#40e8a5}.blueText{color:#49aaff}.goldText{color:#ffc044}.purpleText{color:#b18cff}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #31516b;background:#071522;color:white;margin:5px 0 10px}.positions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pos{padding:10px;background:#0c2032;color:#fff;border:1px solid #31516b;border-radius:9px}.pos.on{border-color:#ffbd38}.alloc{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #183247}.mini{width:38px;height:34px;border:1px solid #31516b;background:#10263a;color:#fff;border-radius:8px;font-size:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07131fdd;backdrop-filter:blur(10px);border-top:1px solid #29455c;padding:10px;text-align:center;font-weight:800}.school{color:#ffbd38;font-weight:800}@media(max-width:480px){.metrics{grid-template-columns:repeat(4,1fr)}.metric{font-size:12px}.metric b{font-size:20px}}</style></head><body><main class="wrap">
<section id="home"><div class="hero"><div style="font-size:62px">🏐</div><h1>排球人生</h1><div class="muted">VOLLEY LIFE · v4</div><p>從高中開始，寫下你的排球生涯。</p></div><div class="card"><button class="btn gold" onclick="showCreate()">開始新生涯</button><button id="continueBtn" class="btn secondary" onclick="loadGame()">繼續生涯</button></div></section>
<section id="create" class="hidden"><h2>建立球員</h2><div class="card"><label>姓名</label><input id="name" class="input" value="洪宸浚"><div class="grid"><div><label>身高 cm</label><input id="height" class="input" type="number" value="180"></div><div><label>體重 kg</label><input id="weight" class="input" type="number" value="72"></div></div><label>位置</label><div id="positions" class="positions"></div><label>高中</label><select id="school"></select><button class="btn gold" onclick="createCareer()">進入排球人生</button><button class="btn secondary" onclick="show('home')">返回</button></div></section>
<section id="dash" class="hidden"><div class="card"><div class="top"><div class="identity"><div class="jersey">10</div><div><h2 id="playerName" style="margin:0"></h2><span id="position" class="pill"></span></div></div><div style="text-align:right"><small class="muted">所屬學校</small><div id="team" class="school"></div><span id="grade" class="pill grade"></span></div></div><div class="metrics"><div class="metric"><b id="age"></b>年齡</div><div class="metric"><b id="year"></b>年份</div><div class="metric"><b id="ovr"></b>綜合</div><div class="metric"><b id="salary">0</b>生涯薪(萬)</div></div></div>
<div id="allocCard" class="card timeline green event"><div class="top"><span class="title greenText">新學年｜能力分配</span><span class="muted">成長階段</span></div><p>本學年獲得 <b id="points"></b> 點成長點數，可自由分配。</p><div id="allocList"></div><button class="btn" onclick="confirmAlloc()">完成能力分配</button></div>
<div id="season"></div><div class="card"><button class="btn gold" onclick="nextStep()">繼續下一週</button><button class="btn secondary" onclick="saveGame(true)">儲存生涯</button><button class="btn secondary" onclick="show('home')">回首頁</button></div></section></main><div class="bottom">🏐 VOLLEY LIFE ｜ 排球人生 v4</div><script>
const positions={OH:'主攻手',S:'舉球員',MB:'副攻手',OP:'接應',L:'自由球員'};const schools=['豐原高商','內湖高工','華僑高中','麥寮高中','屏榮高中','大成商工','內湖高中','頭城家商','福成高中','建國中學','龍津高中','苑裡高中','東方工商','大溪高中','明德高中','曾文農工','瑞芳高工'];const universities=['台灣體大','台北市大','臺灣師大','中原大學','國北教大','彰化師大','大仁科大','台北大學','嘉義大學','臺灣大學','陽明交大','清華大學'];const keys=['扣球','發球','接發','防守','攔網','舉球','彈跳','速度','力量','體能','反應','球商','心態'];let selected='OH',game=null;
function show(id){['home','create','dash'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));refreshContinue()}function showCreate(){show('create')}function renderPositions(){positionsEl.innerHTML='';Object.entries(positions).forEach(([k,v])=>{let b=document.createElement('button');b.className='pos '+(k===selected?'on':'');b.textContent=v;b.onclick=()=>{selected=k;renderPositions()};positionsEl.appendChild(b)})}const positionsEl=document.getElementById('positions');schools.forEach(x=>school.innerHTML+=`<option>${x}</option>`);renderPositions();
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function calc(){game.player.ovr=Math.round(keys.reduce((s,k)=>s+game.player.abilities[k],0)/keys.length)}function createCareer(){let n=name.value.trim();if(!n)return alert('請輸入姓名');let abilities={};keys.forEach(k=>abilities[k]=rnd(48,68));game={version:4,player:{name:n,pos:selected,abilities,ovr:0},team:school.value,age:16,year:2026,grade:1,week:1,points:12,allocated:{},results:{},events:[]};calc();saveGame(false);renderDash();show('dash')}
function renderDash(){let p=game.player;playerName.textContent=p.name;position.textContent=positions[p.pos];team.textContent=game.team;grade.textContent='高'+['','一','二','三'][game.grade];age.textContent=game.age;year.textContent=game.year;ovr.textContent=p.ovr;points.textContent=game.points;allocCard.classList.toggle('hidden',game.points===0);allocList.innerHTML='';keys.forEach(k=>{let used=game.allocated[k]||0;allocList.innerHTML+=`<div class="alloc"><span>${k} <b>${p.abilities[k]}</b> <small class="greenText">+${used}</small></span><button class="mini" onclick="adj('${k}',-1)">−</button><button class="mini" onclick="adj('${k}',1)">＋</button></div>`});renderSeason()}
function adj(k,d){if(d>0&&game.points<=0)return;if(d<0&&!(game.allocated[k]>0))return;game.player.abilities[k]+=d;game.allocated[k]=(game.allocated[k]||0)+d;game.points-=d;calc();renderDash()}function confirmAlloc(){if(game.points>0)return alert('還有 '+game.points+' 點尚未分配');game.allocated={};saveGame(false);renderDash()}
function cupRank(){let strength=game.team==='大成商工'?88:rnd(55,82);let score=strength+game.player.ovr*.25+rnd(-18,18);return score>94?'冠軍':score>88?'亞軍':score>82?'季軍':score>76?'殿軍':'未進四強'}function leagueRank(){let strength=game.team==='大成商工'?88:rnd(55,82);let score=strength+game.player.ovr*.25+rnd(-20,20);return Math.max(1,Math.min(17,18-Math.round(score/7)))}
function nextStep(){if(game.points>0)return alert('請先完成本學年的能力分配');game.week++;let e='日常訓練';if(game.week===5){game.results.yongxin=cupRank();e='永信杯完成'}else if(game.week===10){game.results.huazong=cupRank();e='華宗杯完成'}else if(game.week===16){game.results.league=leagueRank();e='高中聯賽完成'}else{let k=keys[rnd(0,keys.length-1)];game.player.abilities[k]=Math.min(99,game.player.abilities[k]+1);e='訓練：'+k+' +1'}game.events.unshift('第 '+game.week+' 週｜'+e);calc();if(game.week>=18){if(game.grade<3){game.grade++;game.age++;game.year++;game.week=1;game.points=12;game.allocated={};game.results={};game.events=[]}else{alert('高中三年完成！下一階段將進入大學招募。');game.week=18}}saveGame(false);renderDash()}
function renderSeason(){let r=game.results,league=r.league;season.innerHTML=`<div class="card timeline event"><div class="top"><span class="title blueText">本學年進程</span><span class="muted">第 ${game.week} 週</span></div><p>系統會自動安排訓練與正式賽事，不需要選擇比賽或訓練。</p></div><div class="card timeline goldline event"><div class="title goldText">🏆 永信杯</div><p>${r.yongxin||'尚未進行'}（冠亞季殿）</p></div><div class="card timeline goldline event"><div class="title goldText">🏆 華宗杯</div><p>${r.huazong||'尚未進行'}（冠亞季殿）</p></div><div class="card timeline goldline event"><div class="title goldText">🏆 高中聯賽</div><p>${league?(league<=8?'第 '+league+' 名':'未進前八'):'尚未進行'}（顯示前八名）</p></div><div class="card timeline purple event"><div class="title purpleText">狀態｜年度紀錄</div>${game.events.slice(0,5).map(x=>'<p>'+x+'</p>').join('')||'<p class="muted">新學年剛開始。</p>'}</div>`}
function saveGame(msg){localStorage.setItem('volleyball-life-save-v4',JSON.stringify(game));if(msg)alert('生涯已儲存')}function loadGame(){try{game=JSON.parse(localStorage.getItem('volleyball-life-save-v4'));if(!game)throw 0;renderDash();show('dash')}catch(e){alert('目前沒有 v4 存檔')}}function refreshContinue(){continueBtn.disabled=!localStorage.getItem('volleyball-life-save-v4')}refreshContinue();
</script></body></html>
