<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>排球人生 Volleyball Life</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111f;color:#f8fafc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17305c 0,#08111f 42%,#050a12 100%);min-height:100vh}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.hero{text-align:center;padding:50px 10px 30px}.ball{font-size:64px}.hero h1{font-size:38px;margin:10px 0}.sub{color:#a9b8cf}.card{background:#101b2d;border:1px solid #263752;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #0005}.btn{width:100%;padding:15px;border:0;border-radius:15px;font-weight:800;font-size:16px;margin:6px 0;background:#ffb21c;color:#151515}.btn.secondary{background:#1b2b45;color:#fff;border:1px solid #354b6d}.btn.danger{background:#47222a;color:#ffdce2}.btn:disabled{opacity:.35}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0b1525;border-radius:14px;padding:13px}.stat b{font-size:24px;display:block}.label{font-size:12px;color:#94a6bf}.input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #334766;background:#0a1423;color:#fff;font-size:16px;margin:5px 0 12px}.positions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pos{padding:12px;border-radius:12px;border:1px solid #344967;background:#0b1627;color:#fff}.pos.on{border-color:#ffb21c;background:#392c12}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{padding:7px 10px;border-radius:99px;background:#21324d;color:#dce8fa;font-size:12px}.abilities{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bar{height:7px;background:#273650;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#ffb21c}.npc{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #24334a}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#183052;color:#cfe4ff;margin:12px 0}.small{font-size:13px;color:#9db0ca}@media(min-width:650px){.abilities{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><section id="home"><div class="hero"><div class="ball">🏐</div><h1>排球人生</h1><p class="sub">你的每一次選擇，都會改變你的生涯。</p></div><div class="card"><button class="btn" onclick="showCreate()">開始新生涯</button><button id="continueBtn" class="btn secondary" onclick="loadGame()">繼續生涯</button><p class="small">Phase 1 試玩版：角色建立、位置能力、世界種子、高中球隊、NPC 與本機存檔。</p></div></section>
<section id="create" class="hidden"><div class="top"><h2>建立你的球員</h2><span class="pill">高一新生</span></div><div class="card"><label>姓名</label><input id="name" class="input" placeholder="例如：林宇翔" value="林宇翔"><div class="grid"><div><label>身高 cm</label><input id="height" class="input" type="number" value="180"></div><div><label>體重 kg</label><input id="weight" class="input" type="number" value="72"></div></div><label>慣用手</label><select id="hand"><option value="右手">右手</option><option value="左手">左手</option></select><label>位置</label><div class="positions" id="positions"></div><div class="notice">不同位置會產生不同能力傾向與 OVR 權重。</div><button class="btn" onclick="createCareer()">開始我的排球人生</button><button class="btn secondary" onclick="goHome()">返回</button></div></section>
<section id="dash" class="hidden"><div class="top"><div><div class="small">VOLLEYBALL LIFE</div><h2 id="playerName" style="margin:3px 0"></h2></div><span id="seed" class="pill"></span></div><div class="card"><div class="top"><div><div class="small" id="team"></div><h3 id="position"></h3></div><div style="text-align:right"><div class="label">OVR</div><div id="ovr" style="font-size:46px;font-weight:900;color:#ffb21c"></div></div></div><div class="grid"><div class="stat"><span class="label">年齡</span><b>16</b></div><div class="stat"><span class="label">年級</span><b>高一</b></div><div class="stat"><span class="label">潛力</span><b id="potential"></b></div><div class="stat"><span class="label">教練信任</span><b id="trust"></b></div></div></div><div class="card"><h3>能力值</h3><div id="abilities" class="abilities"></div></div><div class="card"><h3>隊內競爭</h3><div id="roster"></div></div><div class="card"><button class="btn" onclick="saveGame(true)">儲存生涯</button><button class="btn secondary" onclick="copySeed()">複製世界 Seed</button><button class="btn secondary" onclick="goHome()">回首頁</button><button class="btn danger" onclick="deleteGame()">刪除存檔</button></div></section></main><script>
const positions={OH:'主攻手 Outside Hitter',S:'舉球員 Setter',MB:'副攻手 Middle Blocker',OP:'接應 Opposite',L:'自由球員 Libero'};let selected='OH',game=null;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rng(seed){let a=hash(seed);return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const keys=['扣球','發球','接發','防守','攔網','舉球','彈跳','速度','力量','體能','反應','球商','心態'];const boosts={OH:{扣球:14,接發:8,彈跳:10,力量:8},S:{舉球:18,球商:12,反應:8,防守:5},MB:{攔網:18,彈跳:12,反應:8,力量:7},OP:{扣球:17,力量:12,攔網:8,發球:6},L:{接發:18,防守:17,反應:12,速度:8}};
function makeSeed(){return 'VL-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}function grade(p){return p>=90?'S':p>=80?'A':p>=70?'B':p>=60?'C':'D'}
function show(id){['home','create','dash'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function showCreate(){show('create')}function goHome(){show('home');refreshContinue()}
function renderPositions(){let el=document.getElementById('positions');el.innerHTML='';Object.entries(positions).forEach(([k,v])=>{let b=document.createElement('button');b.className='pos '+(k===selected?'on':'');b.textContent=v;b.onclick=()=>{selected=k;renderPositions()};el.appendChild(b)})}
function createCareer(){const name=document.getElementById('name').value.trim();if(!name)return alert('請輸入姓名');const seed=makeSeed(),r=rng(seed),abilities={},pot={};keys.forEach(k=>{abilities[k]=Math.min(82,Math.round(45+r()*14+(boosts[selected][k]||0)));pot[k]=Math.min(98,Math.max(abilities[k]+5,Math.round(abilities[k]+10+r()*24)))});const main=Object.keys(boosts[selected]);const ovr=Math.round(main.reduce((a,k)=>a+abilities[k],0)/main.length*.75+keys.reduce((a,k)=>a+abilities[k],0)/keys.length*.25);const teams=['東陽高中','北辰高中','海風高中','青岳高中','晨曦高中','雷峰高中'];const team=teams[Math.floor(r()*teams.length)];const npcNames=['林子安','陳奕辰','許皓宇','張宇翔','王承恩','李柏翰','周子謙','黃俊維','蔡昱廷','吳哲宇'];const roster=npcNames.slice(0,9).map((n,i)=>({name:n,pos:Object.keys(positions)[Math.floor(r()*5)],ovr:Math.round(52+r()*27)}));game={version:1,seed,player:{name,height:+document.getElementById('height').value,weight:+document.getElementById('weight').value,hand:document.getElementById('hand').value,pos:selected,abilities,pot,ovr,trust:Math.round(45+r()*25)},team,roster};saveGame(false);renderDash();show('dash')}
function renderDash(){let p=game.player;playerName.textContent=p.name;seed.textContent=game.seed;team.textContent=game.team;position.textContent=positions[p.pos];ovr.textContent=p.ovr;trust.textContent=p.trust;const avg=Math.round(keys.reduce((a,k)=>a+p.pot[k],0)/keys.length);potential.textContent=grade(avg);abilities.innerHTML='';keys.forEach(k=>{abilities.innerHTML+=`<div class="stat"><span class="label">${k}</span><b>${p.abilities[k]}</b><div class="bar"><i style="width:${p.abilities[k]}%"></i></div></div>`});roster.innerHTML=game.roster.sort((a,b)=>b.ovr-a.ovr).map(n=>`<div class="npc"><span>${n.name} · ${positions[n.pos].split(' ')[0]}</span><b>OVR ${n.ovr}</b></div>`).join('')}
function saveGame(msg){localStorage.setItem('volleyball-life-save',JSON.stringify(game));if(msg)alert('生涯已儲存！')}function loadGame(){try{game=JSON.parse(localStorage.getItem('volleyball-life-save'));if(!game)throw 0;renderDash();show('dash')}catch(e){alert('沒有可讀取的存檔')}}function deleteGame(){if(confirm('確定刪除目前生涯？')){localStorage.removeItem('volleyball-life-save');game=null;goHome()}}function copySeed(){navigator.clipboard?.writeText(game.seed);alert('Seed 已複製：'+game.seed)}function refreshContinue(){continueBtn.disabled=!localStorage.getItem('volleyball-life-save')}renderPositions();refreshContinue();
</script></body></html>
