<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>排球人生 v3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111f;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17305c 0,#08111f 42%,#050a12 100%);min-height:100vh}
.wrap{max-width:820px;margin:auto;padding:24px 16px 70px}.hero{text-align:center;padding:45px 10px 25px}.ball{font-size:64px}
h1{font-size:38px;margin:10px 0}h2,h3{margin-top:8px}.sub,.small{color:#9db0ca}.small{font-size:13px}
.card{background:#101b2d;border:1px solid #263752;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #0005}
.btn{width:100%;padding:15px;border:0;border-radius:15px;font-weight:800;font-size:16px;margin:6px 0;background:#ffb21c;color:#151515}
.btn.secondary{background:#1b2b45;color:#fff;border:1px solid #354b6d}.btn.danger{background:#47222a;color:#ffdce2}.btn:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0b1525;border-radius:14px;padding:13px}.stat b{font-size:23px;display:block}
.label{font-size:12px;color:#94a6bf}.input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #334766;background:#0a1423;color:#fff;font-size:16px;margin:5px 0 12px}
.positions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pos{padding:12px;border-radius:12px;border:1px solid #344967;background:#0b1627;color:#fff}
.pos.on{border-color:#ffb21c;background:#392c12}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{padding:7px 10px;border-radius:99px;background:#21324d;color:#dce8fa;font-size:12px}
.abilities{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bar{height:7px;background:#273650;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#ffb21c}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #24334a}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#183052;color:#cfe4ff;margin:12px 0}
.good{color:#7ee787}.warn{color:#ffcf66}.bad{color:#ff8e8e}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#243a5a;font-size:12px;margin:2px}
.log{max-height:270px;overflow:auto}.log p{padding:9px 0;margin:0;border-bottom:1px solid #24334a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.schoolpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.schoolpick button{padding:11px;border-radius:12px;border:1px solid #344967;background:#0b1627;color:white}
.schoolpick button.on{border-color:#ffb21c;background:#392c12}
@media(min-width:650px){.abilities{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main class="wrap">
<section id="home">
  <div class="hero"><div class="ball">🏐</div><h1>排球人生</h1><p class="sub">從高中一路打進大學與職業聯賽。</p></div>
  <div class="card">
    <button class="btn" onclick="showCreate()">開始新生涯</button>
    <button id="continueBtn" class="btn secondary" onclick="loadGame()">繼續生涯</button>
    <p class="small">v3：17 所高中、大學招募、訓練、比賽、週次推進與職業生涯雛形。</p>
  </div>
</section>

<section id="create" class="hidden">
 <div class="top"><h2>建立你的球員</h2><span class="pill">高一新生</span></div>
 <div class="card">
  <label>姓名</label><input id="name" class="input" value="林宇翔">
  <div class="grid"><div><label>身高 cm</label><input id="height" class="input" type="number" value="180"></div><div><label>體重 kg</label><input id="weight" class="input" type="number" value="72"></div></div>
  <label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select>
  <label>位置</label><div class="positions" id="positions"></div>
  <label>高中</label><div id="schoolPick" class="schoolpick"></div>
  <div class="notice">大成商工固定為傳統強校；其他學校每個新生涯會重新產生強弱。</div>
  <button class="btn" onclick="createCareer()">開始我的排球人生</button><button class="btn secondary" onclick="goHome()">返回</button>
 </div>
</section>

<section id="dash" class="hidden">
 <div class="top"><div><div class="small">VOLLEYBALL LIFE v3</div><h2 id="playerName"></h2></div><span id="seed" class="pill"></span></div>
 <div class="card">
  <div class="top"><div><div class="small" id="team"></div><h3 id="position"></h3></div><div style="text-align:right"><div class="label">OVR</div><div id="ovr" style="font-size:46px;font-weight:900;color:#ffb21c"></div></div></div>
  <div class="grid"><div class="stat"><span class="label">年齡</span><b id="age"></b></div><div class="stat"><span class="label">階段</span><b id="grade"></b></div><div class="stat"><span class="label">第幾週</span><b id="week"></b></div><div class="stat"><span class="label">教練信任</span><b id="trust"></b></div></div>
 </div>

 <div class="card">
  <h3>本週行動</h3><div class="actions">
   <button class="btn" onclick="train()">🏋️ 訓練</button>
   <button class="btn" onclick="playMatch()">🏐 參加比賽</button>
  </div>
  <button class="btn secondary" onclick="nextWeek()">⏭️ 進行下一週</button>
  <p class="small" id="actionHint"></p>
 </div>

 <div class="card"><h3>本季成績</h3><div class="grid"><div class="stat"><span class="label">勝</span><b id="wins"></b></div><div class="stat"><span class="label">敗</span><b id="losses"></b></div><div class="stat"><span class="label">個人表現</span><b id="performance"></b></div><div class="stat"><span class="label">招募評價</span><b id="recruitScore"></b></div></div></div>

 <div id="recruitCard" class="card hidden"><h3>🎓 大學招募中心</h3><p class="small">只能從實際向你提出邀請的大學中選擇。</p><div id="offers"></div></div>
 <div id="proCard" class="card hidden"><h3>🏆 職業球隊</h3><p class="small">城市固定；每個新存檔的隊名與球隊特色隨機生成。</p><div id="proTeams"></div></div>

 <div class="card"><h3>能力值</h3><div id="abilities" class="abilities"></div></div>
 <div class="card"><h3>高中勢力</h3><div id="schoolPower"></div></div>
 <div class="card"><h3>生涯紀錄</h3><div id="careerLog" class="log"></div></div>
 <div class="card"><button class="btn" onclick="saveGame(true)">儲存生涯</button><button class="btn secondary" onclick="goHome()">回首頁</button><button class="btn danger" onclick="deleteGame()">刪除存檔</button></div>
</section>
</main>
<script>
const positions={OH:'主攻手',S:'舉球員',MB:'副攻手',OP:'接應',L:'自由球員'};
const keys=['扣球','發球','接發','防守','攔網','舉球','彈跳','速度','力量','體能','反應','球商','心態'];
const boosts={OH:{扣球:14,接發:8,彈跳:10,力量:8},S:{舉球:18,球商:12,反應:8,防守:5},MB:{攔網:18,彈跳:12,反應:8,力量:7},OP:{扣球:17,力量:12,攔網:8,發球:6},L:{接發:18,防守:17,反應:12,速度:8}};
const highSchools=['豐原高商','內湖高工','華僑高中','麥寮高中','屏榮高中','大成商工','內湖高中','頭城家商','福成高中','建國中學','龍津高中','苑裡高中','東方工商','大溪高中','明德高中','曾文農工','瑞芳高工'];
const universities=['台灣體大','台北市大','臺灣師大','中原大學','國北教大','彰化師大','大仁科大','台北大學','嘉義大學','臺灣大學','陽明交大','清華大學'];
const proCities=['臺北','桃園','臺中','新竹','高雄'];
const proNames=['雷霆','戰翼','烈陽','風暴','海神','獵鷹','黑豹','巨浪','疾風','星火','猛虎','銀河','飛龍','極光','山貓'];
const proStyles=['強攻型','防守型','快速型','攔網型','均衡型','發球壓迫型'];
let selected='OH',selectedSchool='豐原高商',game=null;

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function makeSeed(){return 'VL-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function show(id){['home','create','dash'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function showCreate(){renderPositions();renderSchools();show('create')}
function goHome(){show('home');refreshContinue()}
function renderPositions(){positionsEl=document.getElementById('positions');positionsEl.innerHTML='';Object.entries(positions).forEach(([k,v])=>{let b=document.createElement('button');b.className='pos '+(k===selected?'on':'');b.textContent=v;b.onclick=()=>{selected=k;renderPositions()};positionsEl.appendChild(b)})}
function renderSchools(){let el=document.getElementById('schoolPick');el.innerHTML='';highSchools.forEach(s=>{let b=document.createElement('button');b.className=s===selectedSchool?'on':'';b.textContent=s;b.onclick=()=>{selectedSchool=s;renderSchools()};el.appendChild(b)})}
function calcOVR(p){let main=Object.keys(boosts[p.pos]);return Math.round(main.reduce((a,k)=>a+p.abilities[k],0)/main.length*.75+keys.reduce((a,k)=>a+p.abilities[k],0)/keys.length*.25)}
function makeSchoolPowers(r){let x={};highSchools.forEach(s=>x[s]=s==='大成商工'?Math.round(86+r()*7):Math.round(58+r()*31));return x}
function makePros(r){let names=[...proNames].sort(()=>r()-.5);return proCities.map((city,i)=>({city,name:city+names[i],strength:Math.round(68+r()*25),style:proStyles[Math.floor(r()*proStyles.length)],salary:Math.round(38+r()*82)}))}
function createCareer(){
 const name=document.getElementById('name').value.trim(); if(!name)return alert('請輸入姓名');
 const seed=makeSeed(),r=rng(seed),abilities={},pot={};
 keys.forEach(k=>{abilities[k]=clamp(Math.round(45+r()*14+(boosts[selected][k]||0)),35,82);pot[k]=clamp(Math.round(abilities[k]+10+r()*24),abilities[k]+5,98)});
 let player={name,height:+height.value,weight:+weight.value,hand:hand.value,pos:selected,abilities,pot,trust:Math.round(45+r()*25)};
 player.ovr=calcOVR(player);
 game={version:3,seed,player,stage:'高中',year:1,age:16,week:1,team:selectedSchool,schoolPowers:makeSchoolPowers(r),wins:0,losses:0,performance:0,recruitScore:0,acted:false,offers:[],pros:makePros(r),log:[`16歲：加入${selectedSchool}，展開高中排球生涯。`]};
 saveGame(false);renderDash();show('dash')
}
function stageText(){if(game.stage==='高中')return `高${['一','二','三'][game.year-1]}`;if(game.stage==='大學')return `大${['一','二','三','四'][game.year-1]}`;return '職業'}
function renderDash(){
 let p=game.player;p.ovr=calcOVR(p);
 playerName.textContent=p.name;seed.textContent=game.seed;team.textContent=game.team;position.textContent=positions[p.pos];ovr.textContent=p.ovr;age.textContent=game.age;grade.textContent=stageText();week.textContent=game.week;trust.textContent=p.trust;
 wins.textContent=game.wins;losses.textContent=game.losses;performance.textContent=game.performance;recruitScore.textContent=game.recruitScore;
 actionHint.textContent=game.acted?'本週已完成主要行動，請進行下一週。':'本週可選擇訓練或參加比賽。';
 abilities.innerHTML='';keys.forEach(k=>abilities.innerHTML+=`<div class="stat"><span class="label">${k}</span><b>${p.abilities[k]}</b><div class="bar"><i style="width:${p.abilities[k]}%"></i></div></div>`);
 schoolPower.innerHTML=Object.entries(game.schoolPowers).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="row"><span>${s}${s==='大成商工'?' <span class="tag">傳統強校</span>':''}</span><b>${n}</b></div>`).join('');
 careerLog.innerHTML=[...game.log].reverse().map(x=>`<p>${x}</p>`).join('');
 recruitCard.classList.toggle('hidden',!(game.stage==='招募'));proCard.classList.toggle('hidden',game.stage!=='職業');
 if(game.stage==='招募')renderOffers(); if(game.stage==='職業')renderPros(); saveGame(false)
}
function train(){
 if(game.acted)return alert('本週已經行動過了，請先進行下一週。');
 let p=game.player, choices=Object.keys(boosts[p.pos]);let k=choices[Math.floor(Math.random()*choices.length)],gain=Math.random()<.25?2:1;
 p.abilities[k]=clamp(p.abilities[k]+gain,0,p.pot[k]);p.trust=clamp(p.trust+1,0,100);game.recruitScore+=game.stage==='高中'?1:0;game.acted=true;
 game.log.push(`${stageText()}第${game.week}週：加強${k}訓練，能力 +${gain}。`);renderDash()
}
function playMatch(){
 if(game.acted)return alert('本週已經行動過了，請先進行下一週。');
 let opps=highSchools.filter(s=>s!==game.team),opp=opps[Math.floor(Math.random()*opps.length)];
 let own=(game.schoolPowers[game.team]||75)+game.player.ovr*.25+game.player.trust*.08+Math.random()*18;
 let other=(game.schoolPowers[opp]||75)+Math.random()*22;
 let win=own>=other,perf=clamp(Math.round(game.player.ovr*.55+game.player.trust*.2+Math.random()*30),40,100);
 win?game.wins++:game.losses++;game.performance+=Math.round(perf/10);game.player.trust=clamp(game.player.trust+(perf>=75?3:perf>=60?1:-1),0,100);
 if(game.stage==='高中')game.recruitScore+=Math.round(perf/12)+(win?2:0);
 game.acted=true;game.log.push(`${stageText()}第${game.week}週：對戰${opp}，${win?'勝利':'落敗'}，個人表現 ${perf}。`);renderDash()
}
function nextWeek(){
 if(game.stage==='招募')return alert('請先選擇一所招募你的大學。');
 game.week++;game.acted=false;
 if(game.week>12){game.week=1;endSeason()} else game.log.push(`進入${stageText()}第${game.week}週。`);
 renderDash()
}
function endSeason(){
 if(game.stage==='高中'){
   if(game.year<3){game.year++;game.age++;game.wins=game.losses=game.performance=0;game.log.push(`升上高${['一','二','三'][game.year-1]}。新賽季開始。`)}
   else{game.stage='招募';game.log.push('高中生涯結束，進入大學招募。');generateOffers()}
 }else if(game.stage==='大學'){
   if(game.year<4){game.year++;game.age++;game.wins=game.losses=game.performance=0;game.log.push(`升上大${['一','二','三','四'][game.year-1]}。`)}
   else{game.stage='職業';game.age++;game.team='待加盟';game.log.push('大學生涯畢業，進入職業階段。')}
 }else if(game.stage==='職業'){game.age++;game.log.push(`完成一個職業賽季，現在 ${game.age} 歲。`)}
}
function generateOffers(){
 let score=game.recruitScore+game.player.ovr*.8+game.player.trust*.25;
 let count=score>125?6:score>105?4:score>88?3:2;
 let pool=[...universities].sort(()=>Math.random()-.5);game.offers=pool.slice(0,count).map((u,i)=>({name:u,role:i<2?'主力培養':i<4?'輪替球員':'培養球員'}))
}
function renderOffers(){offers.innerHTML=game.offers.map((o,i)=>`<div class="row"><span><b>${o.name}</b><br><span class="small">${o.role}</span></span><button class="pos" onclick="chooseUniversity(${i})">接受邀請</button></div>`).join('')}
function chooseUniversity(i){let o=game.offers[i];game.stage='大學';game.year=1;game.age=19;game.week=1;game.team=o.name;game.wins=game.losses=game.performance=0;game.acted=false;game.log.push(`接受${o.name}招募，成為大一球員。`);renderDash()}
function renderPros(){proTeams.innerHTML=game.pros.map((t,i)=>`<div class="row"><span><b>${t.name}</b><br><span class="small">${t.style}｜球隊強度 ${t.strength}｜預估年薪 ${t.salary} 萬</span></span><button class="pos" onclick="joinPro(${i})">${game.team===t.name?'已加盟':'加盟'}</button></div>`).join('')}
function joinPro(i){let t=game.pros[i];game.team=t.name;game.log.push(`加盟${t.name}，正式展開職業生涯。`);renderDash()}
function saveGame(msg){localStorage.setItem('volleyball-life-save',JSON.stringify(game));if(msg)alert('生涯已儲存！')}
function migrate(g){if(!g.version||g.version<3){alert('偵測到舊版存檔。v3 系統差異較大，建議開始新生涯以使用完整功能。');return null}return g}
function loadGame(){try{let g=JSON.parse(localStorage.getItem('volleyball-life-save'));game=migrate(g);if(!game)throw 0;renderDash();show('dash')}catch(e){alert('目前沒有可讀取的 v3 存檔，請開始新生涯。')}}
function deleteGame(){if(confirm('確定刪除目前生涯？')){localStorage.removeItem('volleyball-life-save');game=null;goHome()}}
function refreshContinue(){continueBtn.disabled=!localStorage.getItem('volleyball-life-save')}
renderPositions();renderSchools();refreshContinue();
</script></body></html>
