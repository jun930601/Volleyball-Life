<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="icon" type="image/png" href="icon.png">

<title>排球人生 v6</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef6ff;background:#06101b}
*{box-sizing:border-box}html,body{touch-action:manipulation;overscroll-behavior:none}body{margin:0;background:linear-gradient(#071523,#040a11);min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:18px 14px 100px}.hero{text-align:center;padding:45px 8px}.hero h1{font-size:42px;margin:8px}
.sub,.muted{color:#91a4b8}.card{background:linear-gradient(135deg,#0c1c2c,#091522);border:1px solid #29455c;border-radius:16px;padding:16px;margin:12px 0}
.btn{width:100%;border:0;border-radius:12px;padding:14px;margin:5px 0;font-weight:800;font-size:16px;background:#26d890;color:#052116}
.secondary{background:#10263a;color:#dcecff;border:1px solid #31536e}.gold{background:#ffbd38;color:#241800}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.identity{display:flex;align-items:center;gap:12px;min-width:0}
.jersey{width:72px;height:72px;border:2px solid #ffbd38;border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:900;flex:0 0 auto}
.pill{display:inline-block;padding:7px 11px;border-radius:9px;background:#17334a}.grade{background:#ffbd38;color:#211500;font-weight:900;margin-top:5px}
.schoolBox{text-align:right;min-width:105px}.school{color:#ffbd38;font-weight:900;font-size:18px;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{text-align:center;background:#0c2032;border:1px solid #294a64;border-radius:10px;padding:10px 5px}
.metric b{display:block;font-size:22px}.timeline{border-left:3px solid #2c91e8;padding-left:13px;margin:14px 0}.event{position:relative}.event:before{content:'';position:absolute;left:-22px;top:25px;width:12px;height:12px;border-radius:50%;background:#2c91e8}
.event.green{border-color:#24dc98}.event.green:before{background:#24dc98}.event.goldline{border-color:#ffbd38}.event.goldline:before{background:#ffbd38}.event.purple{border-color:#a47aff}.event.purple:before{background:#a47aff}
.title{font-weight:900;font-size:19px}.greenText{color:#40e8a5}.blueText{color:#49aaff}.goldText{color:#ffc044}.purpleText{color:#b18cff}.redText{color:#ff8c8c}
.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #31516b;background:#071522;color:white;margin:5px 0 10px}
.positions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pos{padding:12px 8px;background:#0c2032;color:#fff;border:1px solid #31516b;border-radius:9px;font-weight:800}.pos.on{border-color:#ffbd38;color:#ffc044}
.alloc{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #183247}.mini{width:38px;height:34px;border:1px solid #31516b;background:#10263a;color:#fff;border-radius:8px;font-size:18px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#07131fdd;backdrop-filter:blur(10px);border-top:1px solid #29455c;padding:10px;text-align:center;font-weight:800}
.choice{padding:13px;border:1px solid #31516b;border-radius:12px;background:#0b1c2b;margin:8px 0}.choice h3{margin:0 0 6px}.tag{float:right;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:900;background:#17334a}
.uni{display:grid;gap:8px}.uni button{text-align:left}.sectionHead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.profileCompact{padding:12px;overflow:hidden}
.profileLine{display:grid;grid-template-columns:52px minmax(105px,1.35fr) minmax(88px,1fr) repeat(6,minmax(54px,.72fr));align-items:center;gap:6px;width:100%}
.profileCompact .identity{display:contents}.profileCompact .jersey{width:48px;height:48px;font-size:22px}
.profileName{font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileCompact .pill{padding:4px 7px;font-size:10px;white-space:nowrap}
.profileSchool{text-align:center;min-width:0}.profileSchool .school{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniMetric{min-width:0;text-align:center;padding-left:5px;border-left:1px solid #29455c;white-space:nowrap}
.miniMetric b{display:block;font-size:14px}.miniMetric small{font-size:9px;color:#91a4b8}
.modalBack{position:fixed;inset:0;background:#02070dcc;display:grid;place-items:center;padding:18px;z-index:50}.modalBack.hidden{display:none}.modal{width:min(520px,100%);background:#0b1c2b;border:1px solid #ffbd38;border-radius:18px;padding:20px;box-shadow:0 20px 60px #000}.diceRow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.die{width:48px;height:48px;border:1px solid #ffbd38;border-radius:10px;background:#151f2b;color:#ffc044;font-size:22px;font-weight:900}.die.used{opacity:.35;border-color:#52606e}.injury{border-color:#ff6868!important}.rewardBadge{display:inline-block;background:#17334a;border:1px solid #31516b;border-radius:9px;padding:7px 10px;margin:4px}.seasonRecord{font-size:13px;color:#91a4b8;margin-top:10px}@media(max-width:480px){
 .metrics{grid-template-columns:repeat(2,1fr)}.metric{font-size:12px}.metric b{font-size:20px}.top{align-items:flex-start}.schoolBox{max-width:120px}.jersey{width:64px;height:64px}
 .profileCompact{padding:10px}
 .profileLine{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .profileLine::-webkit-scrollbar{display:none}
 .profileCompact .identity{display:flex;align-items:center;gap:7px;min-width:174px}
 .profileCompact .jersey{flex:0 0 46px;width:46px;height:46px;font-size:21px}
 .profileName{font-size:18px;max-width:108px}
 .profileSchool{flex:0 0 84px}
 .miniMetric{flex:0 0 58px}
}

.seedRow{display:grid;grid-template-columns:1fr 82px;gap:8px;align-items:start}
.seedBtn{height:48px;margin-top:5px;border-radius:12px;border:1px solid #38536c;background:#102438;color:#dcecff;font-weight:800}
.themePick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.themeChoice{min-height:92px;text-align:left;padding:14px;border-radius:15px;border:1px solid #35506a;background:linear-gradient(145deg,#0c1b2b,#10263a);color:#fff}
.themeChoice b,.themeChoice small{display:block}.themeChoice b{font-size:15px;margin-bottom:7px}.themeChoice small{color:#91a4b8;line-height:1.4}
.themeChoice.on{border-color:#ffc044;box-shadow:0 0 0 1px #ffc04455 inset}
body.theme-night{background-image:linear-gradient(#04111fd9,#04111ff0),url('bg-night.jpg');background-size:cover;background-position:center;background-attachment:fixed;background:
 linear-gradient(#04111fd9,#04111ff0),
 radial-gradient(circle at 18% 0%,#164a7a 0,transparent 34%),
 linear-gradient(135deg,#07111d,#0b2031 55%,#06101a)}
body.theme-youth{background-image:linear-gradient(#13202acc,#13202ae8),url('bg-youth.jpg');background-size:cover;background-position:center;background-attachment:fixed;background:
 linear-gradient(#13202acc,#13202ae8),
 radial-gradient(circle at 85% 5%,#d69b48 0,transparent 30%),
 linear-gradient(135deg,#233a49,#71512f 58%,#152330)}
body.theme-youth .card{background:#10202bea;border-color:#496171}
body.theme-youth .bottom{background:#10191feF}
.profileLine2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #29455c}
.profileLine2 .miniMetric{border-left:0;padding-left:0}
@media(max-width:480px){
 .themePick{grid-template-columns:1fr 1fr}
 .profileLine{display:grid!important;grid-template-columns:46px minmax(100px,1fr) minmax(82px,.85fr)!important;overflow:visible!important}
 .profileCompact .identity{display:contents!important;min-width:0!important}
 .profileName{max-width:none!important}
 .profileLine2{grid-template-columns:repeat(3,1fr);row-gap:9px}
 .profileLine2 .miniMetric:nth-child(n+4){border-top:1px solid #29455c;padding-top:7px}
}

</style>
</head>
<body><main class="wrap">
<section id="home">
 <div class="hero"><div style="font-size:62px">🏐</div><h1>排球人生</h1><div class="muted">VOLLEY LIFE · v6.2</div><p>從高中開始，寫下你的排球生涯。</p></div>
 <div class="card"><button class="btn gold" onclick="showCreate()">開始新生涯</button><button id="continueBtn" class="btn secondary" onclick="loadGame()">繼續生涯</button></div>
</section>

<section id="create" class="hidden">
 <h2>建立球員</h2><div class="card">
 <label>姓名</label><input id="name" class="input" value="洪宸浚">
 <label>背號</label><select id="jerseySelect"></select>
 <label>位置</label><div id="positions" class="positions"></div>
 <p class="muted">身高與體重會依照位置由系統自動生成，生涯中仍會顯示並可能改變。</p>
 <label>高中</label><select id="school"></select>
<label>種子代碼</label>
<div class="seedRow"><input id="seedCode" class="input" placeholder="留空將自動產生"><button type="button" class="seedBtn" onclick="randomizeSeed()">隨機</button></div>
<label>球館背景</label>
<div class="themePick">
 <button type="button" id="themeNight" class="themeChoice on" onclick="selectTheme('night')"><b>🌙 深夜球館</b><small>冷色燈光・沉浸球場</small></button>
 <button type="button" id="themeYouth" class="themeChoice" onclick="selectTheme('youth')"><b>☀️ 青春球館</b><small>暖陽木地板・校園感</small></button>
</div>
 <button class="btn gold" onclick="createCareer()">進入排球人生</button><button class="btn secondary" onclick="show('home')">返回</button>
 </div>
</section>

<section id="dash" class="hidden">
 <div class="card profileCompact"><div class="profileLine">
  <div class="identity"><div id="jersey" class="jersey"></div><div><h2 id="playerName" class="profileName" style="margin:0 0 4px"></h2><span id="position" class="pill"></span></div><div class="profileLine2"></div></div>
  <div class="profileSchool"><small class="muted">所屬學校</small><div id="team" class="school"></div><span id="grade" class="pill grade"></span></div>
  <div class="miniMetric"><b id="age"></b><small>年齡</small></div><div class="miniMetric"><b id="year"></b><small>年份</small></div><div class="miniMetric"><b id="ovr"></b><small>綜合</small></div><div class="miniMetric"><b id="height"></b><small>身高</small></div><div class="miniMetric"><b id="weight"></b><small>體重</small></div><div class="miniMetric"><b id="salary">0</b><small>生涯薪(萬)</small></div>
 </div></div>
 <div id="allocCard" class="card timeline green event"><div class="top"><span class="title greenText" id="allocTitle">球季前｜訓練成果</span><span class="muted" id="allocModeLabel">骰子分配</span></div><p id="allocHelp"></p><div id="diceBox" class="diceRow"></div><div id="allocList"></div><button class="btn" onclick="confirmAlloc()">完成能力分配</button></div>
 <div id="randomEvent"></div><div id="season"></div>
 <div class="card"><button id="nextBtn" class="btn gold" onclick="nextStep()">繼續下一週</button><button class="btn secondary" onclick="saveGame(true)">儲存生涯</button><button class="btn secondary" onclick="show('home')">回首頁</button></div>
</section>

<section id="recruit" class="hidden">
 <h2>🎓 大學招募</h2><div class="card"><div class="title goldText">高中生涯完成</div><p id="recruitSummary"></p><p class="muted">依照高中表現與球員能力，以下學校向你提出招募邀請。</p></div>
 <div id="offers" class="uni"></div><button class="btn secondary" onclick="show('dash')">返回查看高中紀錄</button>
</section>
</main><div id="matchModal" class="modalBack hidden"></div><div class="bottom">🏐 VOLLEY LIFE ｜ 排球人生 v6.2</div>

<script>
const positions={OH:'主攻手',S:'舉球員',MB:'副攻手',L:'自由球員'};
const schools=['豐原高商','內湖高工','華僑高中','麥寮高中','屏榮高中','大成商工','內湖高中','頭城家商','福成高中','建國中學','龍津高中','苑裡高中','東方工商','大溪高中','明德高中','曾文農工','瑞芳高工'];
const universities=['台灣體大','台北市大','臺灣師大','中原大學','國北教大','彰化師大','大仁科大','台北大學','嘉義大學','臺灣大學','陽明交大','清華大學'];
const keys=['扣球','發球','接發','防守','攔網','舉球','彈跳','速度','力量','體能','球商'];
const matchSchedule={3:{key:'yongxin',name:'永信杯',type:'cup'},6:{key:'huazong',name:'華宗杯',type:'cup'},10:{key:'league',name:'高中聯賽',type:'league'}};
let selected='OH',game=null,selectedDie=null;
const $=id=>document.getElementById(id),nameEl=$('name'),schoolEl=$('school'),continueBtnEl=$('continueBtn'),positionsEl=$('positions');
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seedRand(seed,salt=0){let x=(hashSeed(seed)+salt*2654435761)>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}
function makeSeed(){return 'VL-'+Math.floor(100000+Math.random()*900000)}
function randomizeSeed(){if($('seedCode'))$('seedCode').value=makeSeed()}
function selectTheme(t){selectedTheme=t;document.body.classList.remove('theme-night','theme-youth');document.body.classList.add('theme-'+t);if($('themeNight'))$('themeNight').classList.toggle('on',t==='night');if($('themeYouth'))$('themeYouth').classList.toggle('on',t==='youth')}
function applyTheme(){selectTheme((game&&game.theme)||selectedTheme||'night')}

function show(id){applyTheme();['home','create','dash','recruit'].forEach(x=>$(x).classList.toggle('hidden',x!==id));refreshContinue()} function showCreate(){show('create')}
function renderPositions(){positionsEl.innerHTML='';Object.entries(positions).forEach(([k,v])=>{let b=document.createElement('button');b.className='pos '+(k===selected?'on':'');b.textContent=v;b.onclick=()=>{selected=k;renderPositions()};positionsEl.appendChild(b)})}
schools.forEach(x=>schoolEl.innerHTML+=`<option>${x}</option>`);for(let i=1;i<=20;i++)$('jerseySelect').innerHTML+=`<option value="${i}" ${i===10?'selected':''}>${i} 號</option>`;renderPositions();
function bodyFor(pos){const r={OH:[176,190,65,82],MB:[184,200,70,90],S:[172,185,62,78],L:[165,180,57,72]}[pos];return{height:rnd(r[0],r[1]),weight:rnd(r[2],r[3])}}
function calc(){game.player.ovr=Math.round(keys.reduce((s,k)=>s+game.player.abilities[k],0)/keys.length)}
function talentDiceCount(t){
 let roll=Math.random()*100;
 if(t>=90)return roll<50?7:roll<80?6:5;
 if(t>=80)return roll<35?6:roll<70?5:4;
 if(t>=70)return roll<30?5:roll<65?4:3;
 if(t>=60)return roll<35?4:roll<70?3:2;
 return roll<45?2:1;
}
function newPreseasonDice(){
 let n=talentDiceCount(game.player.talent||60);
 game.allocMode='preseason';
 game.dice=Array.from({length:n},()=>({value:rnd(1,7),used:false,key:null}));
 game.points=0;game.allocated={};
}
function createCareer(){let n=nameEl.value.trim();if(!n)return alert('請輸入姓名');let abilities={};keys.forEach(k=>abilities[k]=rnd(48,68));let body=bodyFor(selected);game={version:6,stage:'highschool',player:{name:n,pos:selected,jersey:+$('jerseySelect').value,height:body.height,weight:body.weight,talent:50+Math.floor(seedRand(seed,7)*50),abilities,ovr:0},team:schoolEl.value,age:16,year:2026,grade:1,week:1,points:0,allocated:{},results:{},history:[],events:[],pendingEvent:null,pendingMatch:null,injury:null,seasonEnded:false};newPreseasonDice();calc();saveGame(false);renderDash();show('dash')}
function migrate(){if(!game.seed)game.seed=makeSeed();if(!game.theme)game.theme='night';if(!game.player.talent)game.player.talent=50+Math.floor(seedRand(game.seed,7)*50);delete game.player.abilities['反應'];delete game.player.abilities['心態'];if(!game.player.jersey)game.player.jersey=10;if(!game.player.height||!game.player.weight){let b=bodyFor(game.player.pos==='OP'?'OH':game.player.pos);game.player.height=b.height;game.player.weight=b.weight}if(game.player.pos==='OP')game.player.pos='OH';game.history=game.history||[];game.events=game.events||[];game.results=game.results||{};game.pendingEvent=null;game.pendingMatch=game.pendingMatch||null;game.injury=game.injury||null;game.stage=game.stage||'highschool';game.week=Math.min(game.week||1,10);if(!game.allocMode&&game.points>0){game.allocMode='postseason'}if(!game.dice&&game.points===0&&game.week===1)newPreseasonDice()}
function allocOpen(){return (game.allocMode==='preseason'&&game.dice&&game.dice.some(d=>!d.used))||(game.allocMode==='postseason'&&game.points>0)}
function renderDash(){migrate();let p=game.player;$('playerName').textContent=p.name;$('jersey').textContent=p.jersey;$('position').textContent=positions[p.pos];$('team').textContent=game.team;$('grade').textContent=game.stage==='university'?'大'+['','一','二','三','四'][game.grade]:'高'+['','一','二','三'][game.grade];$('age').textContent=game.age;$('year').textContent=game.year;$('ovr').textContent=p.ovr;$('height').textContent=p.height+'cm';$('weight').textContent=p.weight+'kg';renderAlloc();renderRandomEvent();renderSeason();$('nextBtn').disabled=!!game.pendingEvent||!!game.pendingMatch||allocOpen();renderMatchModal()}
function renderAlloc(){let card=$('allocCard');card.classList.toggle('hidden',!allocOpen());$('allocList').innerHTML='';$('diceBox').innerHTML='';if(!allocOpen())return;if(game.allocMode==='preseason'){$('allocTitle').textContent='球季前｜分配訓練成果';$('allocModeLabel').textContent=`${game.dice.length} 顆骰子`;$('allocHelp').textContent='點選一顆骰子，再點能力旁的「套用」。每顆骰子最高 7 點。';game.dice.forEach((d,i)=>{$('diceBox').innerHTML+=`<button class="die ${d.used?'used':''}" ${d.used?'disabled':''} onclick="selectDie(${i})">${d.value}</button>`});keys.forEach(k=>{$('allocList').innerHTML+=`<div class="alloc"><span>${k} <b>${game.player.abilities[k]}</b></span><span></span><button class="mini" onclick="applyDie('${k}')">＋</button></div>`})}else{$('allocTitle').textContent='季末｜分配比賽成果';$('allocModeLabel').textContent=`剩餘 ${game.points} 點`;$('allocHelp').textContent='比賽成績轉成能力點，季末可以 1 點 1 點自由分配。';keys.forEach(k=>{let used=game.allocated[k]||0;$('allocList').innerHTML+=`<div class="alloc"><span>${k} <b>${game.player.abilities[k]}</b> <small class="greenText">+${used}</small></span><button class="mini" onclick="adjPoint('${k}',-1)">−</button><button class="mini" onclick="adjPoint('${k}',1)">＋</button></div>`})}}
function selectDie(i){if(game.dice[i].used)return;selectedDie=i;renderAlloc();document.querySelectorAll('.die')[i]?.focus()}
function applyDie(k){if(selectedDie===null||!game.dice[selectedDie]||game.dice[selectedDie].used)return alert('請先點選一顆骰子');let d=game.dice[selectedDie];game.player.abilities[k]=clamp(game.player.abilities[k]+d.value,1,99);d.used=true;d.key=k;game.events.unshift(`球季前訓練｜${k} +${d.value}`);selectedDie=null;calc();saveGame(false);renderDash()}
function adjPoint(k,d){if(d>0&&game.points<=0)return;if(d<0&&!(game.allocated[k]>0))return;game.player.abilities[k]=clamp(game.player.abilities[k]+d,1,99);game.allocated[k]=(game.allocated[k]||0)+d;game.points-=d;calc();renderDash()}
function confirmAlloc(){if(game.allocMode==='preseason'&&game.dice.some(d=>!d.used))return alert('還有骰子尚未分配');if(game.allocMode==='postseason'&&game.points>0)return alert('還有 '+game.points+' 點尚未分配');game.allocMode=null;game.dice=[];game.allocated={};if(game.seasonEnded){game.seasonEnded=false;advanceYear()}saveGame(false);renderDash()}
const randomEvents=[{name:'增加食量',desc:'近期訓練量提高，你決定增加每天的食量。',choices:[{text:'增加食量',chance:60,success:'力量 +5',fail:'體重 +5 kg',run(ok){if(ok)game.player.abilities['力量']+=5;else game.player.weight+=5}},{text:'維持正常飲食',chance:100,success:'沒有額外變化',fail:'',run(){}}]},{name:'自主重量訓練',desc:'利用休息時間加強重量訓練。',choices:[{text:'挑戰高強度',chance:55,success:'力量 +4、彈跳 +1',fail:'體能 -2',run(ok){if(ok){game.player.abilities['力量']+=4;game.player.abilities['彈跳']+=1}else game.player.abilities['體能']-=2}},{text:'穩定訓練',chance:85,success:'力量 +2',fail:'沒有變化',run(ok){if(ok)game.player.abilities['力量']+=2}}]}];
function maybeEvent(){if(game.pendingEvent||game.pendingMatch||game.injury?.weeks>0)return;if([2,5,8].includes(game.week)&&Math.random()<0.45){let ev=randomEvents[rnd(0,randomEvents.length-1)];game.pendingEvent={idx:randomEvents.indexOf(ev)}}}
function maybeInjury(){if(game.pendingEvent||game.pendingMatch||game.injury?.weeks>0||Math.random()>=0.12)return false;let injuries=[{name:'手指扭傷',weeks:1,loss:{'接發':1,'舉球':1}},{name:'腳踝扭傷',weeks:2,loss:{'速度':2,'彈跳':2}},{name:'肩膀拉傷',weeks:3,loss:{'扣球':3,'發球':2}},{name:'膝蓋重傷',weeks:99,loss:{'彈跳':6,'速度':5,'力量':3},season:true}];let x=injuries[rnd(0,injuries.length-1)];Object.entries(x.loss).forEach(([k,v])=>game.player.abilities[k]=clamp(game.player.abilities[k]-v,1,99));game.injury={name:x.name,weeks:x.weeks,season:!!x.season};game.events.unshift(`第 ${game.week} 週｜受傷：${x.name}${x.season?'（整季報銷）':'，休養 '+x.weeks+' 週'}`);calc();return true}
function chooseEvent(i){let ev=randomEvents[game.pendingEvent.idx],c=ev.choices[i],ok=Math.random()*100<c.chance;c.run(ok);keys.forEach(k=>game.player.abilities[k]=clamp(game.player.abilities[k],1,99));calc();game.events.unshift(`第 ${game.week} 週｜${ev.name}｜${ok?c.success:(c.fail||'沒有變化')}`);game.pendingEvent=null;saveGame(false);renderDash()}
function renderRandomEvent(){let box=$('randomEvent');if(!game.pendingEvent){box.innerHTML='';return}let ev=randomEvents[game.pendingEvent.idx];box.innerHTML=`<div class="card timeline green event"><div class="title goldText">🎲 隨機事件｜${ev.name}</div><p>${ev.desc}</p>${ev.choices.map((c,i)=>`<div class="choice"><h3>${c.text}</h3><div class="muted">成功率 ${c.chance}%｜成功：${c.success}${c.fail?'｜失敗：'+c.fail:''}</div><button class="btn secondary" onclick="chooseEvent(${i})">選擇</button></div>`).join('')}</div>`}
function cupRank(){let strength=game.team==='大成商工'?88:rnd(55,82),score=strength+game.player.ovr*.25+rnd(-18,18);return score>94?'冠軍':score>88?'亞軍':score>82?'季軍':score>76?'殿軍':'未進四強'}
function leagueRank(){let strength=game.team==='大成商工'?88:rnd(55,82),score=strength+game.player.ovr*.25+rnd(-20,20);return Math.max(1,Math.min(17,18-Math.round(score/7)))}
function scheduleMatch(){let m=matchSchedule[game.week];if(!m||game.results[m.key])return;if(game.injury?.season||game.injury?.weeks>0){let result=m.type==='league'?rnd(5,17):['未進四強','殿軍','季軍'][rnd(0,2)];game.results[m.key]=result;game.events.unshift(`第 ${game.week} 週｜${m.name}：因傷缺席｜球隊成績 ${formatResult(m,result)}`);if(game.week===10)endSeason();return}game.pendingMatch=m}
function formatResult(m,r){return m.type==='league'?(r<=8?'第 '+r+' 名':'未進前八'):r}
function playMatch(){let m=game.pendingMatch;if(!m)return;let result=m.type==='league'?leagueRank():cupRank();game.results[m.key]=result;game.events.unshift(`第 ${game.week} 週｜${m.name}｜${formatResult(m,result)}`);game.pendingMatch=null;saveGame(false);if(game.week===10)endSeason();renderDash()}
function renderMatchModal(){let box=$('matchModal');if(!game.pendingMatch){box.classList.add('hidden');box.innerHTML='';return}let m=game.pendingMatch;box.classList.remove('hidden');box.innerHTML=`<div class="modal"><div class="title goldText">🏆 ${m.name}</div><h2>比賽時間到了！</h2><p>${game.team} 即將參加 ${m.name}。</p><button class="btn gold" onclick="playMatch()">進入比賽</button></div>`}
function rewardForResult(key,r){if(key==='league'){if(r===1)return 10;if(r===2)return 7;if(r<=4)return 5;if(r<=8)return 3;return 1}return {'冠軍':10,'亞軍':7,'季軍':5,'殿軍':3,'未進四強':1}[r]||0}
function endSeason(){let total=Object.entries(game.results).reduce((s,[k,r])=>s+rewardForResult(k,r),0);game.points=total;game.allocMode='postseason';game.allocated={};game.seasonEnded=true;game.events.unshift(`季末結算｜獲得 ${total} 點比賽成果能力點`);saveGame(false)}
function advanceYear(){game.history.push({stage:game.stage,year:game.year,grade:game.grade,team:game.team,results:{...game.results},ovr:game.player.ovr});if(game.stage==='highschool'&&game.grade===3){game.stage='recruit';saveGame(false);makeOffers();return}game.grade++;game.age++;game.year++;game.week=1;game.results={};game.events=[];game.injury=null;if(game.age<=19&&Math.random()<.75)game.player.height+=rnd(0,2);game.player.weight=clamp(game.player.weight+rnd(-1,2),45,120);newPreseasonDice()}
function nextStep(){if(allocOpen())return alert('請先完成能力分配');if(game.pendingEvent||game.pendingMatch)return alert('請先處理目前事件');if(game.week>=10)return;game.week++;if(game.injury?.weeks>0&&!game.injury.season){game.injury.weeks--;if(game.injury.weeks===0){game.events.unshift(`第 ${game.week} 週｜傷勢恢復，可以重新出賽`);game.injury=null}}let m=matchSchedule[game.week];if(m){scheduleMatch()}else{if(!maybeInjury()){let k=keys[rnd(0,keys.length-1)];if(!game.injury?.season){game.player.abilities[k]=clamp(game.player.abilities[k]+1,1,99);game.events.unshift(`第 ${game.week} 週｜訓練：${k} +1`)}}maybeEvent()}calc();saveGame(false);renderDash()}
function scoreCareer(){let s=game.player.ovr;game.history.forEach(h=>Object.entries(h.results||{}).forEach(([k,r])=>s+=rewardForResult(k,r)));return s}
function makeOffers(){let score=scoreCareer(),count=score>=95?8:score>=85?6:score>=75?5:4;game.offers=[...universities].sort(()=>Math.random()-.5).slice(0,count);saveGame(false);renderRecruit();show('recruit')}
function renderRecruit(){if(!game.offers||!game.offers.length){makeOffers();return}$('recruitSummary').textContent=`${game.player.name}｜${game.team}｜高中畢業 OVR ${game.player.ovr}`;$('offers').innerHTML=game.offers.map(u=>`<div class="card"><div class="title">${u}</div><p class="muted">排球隊向你提出入學招募邀請。</p><button class="btn gold" onclick="joinUniversity('${u}')">選擇 ${u}</button></div>`).join('')}
function joinUniversity(u){if(!confirm(`確定接受 ${u} 的招募邀請嗎？`))return;game.team=u;game.stage='university';game.grade=1;game.age=19;game.year++;game.week=1;game.results={};game.events=[`正式加入 ${u} 排球隊`];game.injury=null;newPreseasonDice();saveGame(false);renderDash();show('dash')}
function renderSeason(){if(game.stage==='university'){$('season').innerHTML=`<div class="card timeline purple event"><div class="title purpleText">🎓 大學生涯</div><p>你已加入 <b>${game.team}</b>。大學賽事系統下一階段擴充。</p></div>`;return}let records=Object.entries(game.results).map(([k,r])=>{let m=Object.values(matchSchedule).find(x=>x.key===k);return m?`${m.name}：${formatResult(m,r)}`:''}).filter(Boolean);$('season').innerHTML=`<div class="card timeline event"><div class="top"><span class="title blueText">本學年進程</span><span class="muted">第 ${game.week} / 10 週</span></div><p>比賽會在第 3、6、10 週自動跳出。</p>${game.injury?`<p class="redText">🚑 ${game.injury.name}${game.injury.season?'｜整季報銷':'｜剩餘 '+game.injury.weeks+' 週'}</p>`:''}<div class="seasonRecord">${records.length?records.join('　｜　'):'目前尚無比賽紀錄'}</div></div><div class="card timeline purple event"><div class="title purpleText">狀態｜年度紀錄</div>${game.events.slice(0,6).map(x=>'<p>'+x+'</p>').join('')||'<p class="muted">新學年剛開始。</p>'}</div>`}
function saveGame(msg){localStorage.setItem('volleyball-life-save-v6',JSON.stringify(game));if(msg)alert('生涯已儲存')}
function loadGame(){try{game=JSON.parse(localStorage.getItem('volleyball-life-save-v6'))||JSON.parse(localStorage.getItem('volleyball-life-save-v5'))||JSON.parse(localStorage.getItem('volleyball-life-save-v4'));if(!game)throw 0;migrate();calc();if(game.stage==='recruit'){if(!game.offers)makeOffers();else{renderRecruit();show('recruit')}}else{renderDash();show('dash')}}catch(e){console.error(e);alert('目前沒有可讀取的存檔')}}
function refreshContinue(){continueBtnEl.disabled=!(localStorage.getItem('volleyball-life-save-v6')||localStorage.getItem('volleyball-life-save-v5')||localStorage.getItem('volleyball-life-save-v4'))}
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});selectTheme('night');refreshContinue();
</script></body></html>
